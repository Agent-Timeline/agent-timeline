<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chat Completions SSE example</title></head><body><main><h1>Chat Completions SSE</h1><p>Synthetic responses, no live model. This app uses a standard text SSE parser, without the Agent Timeline client.</p><label for="mode">Request handling</label><select id="mode"><option value="fixed">Fixed</option><option value="buggy">Buggy</option></select><form id="chat"><label for="prompt">Prompt</label><textarea id="prompt">Suggest a project title</textarea><button id="send">Send</button><button id="cancel" type="button" disabled>Cancel</button></form><p id="status" role="status">Ready</p><h2>Response</h2><div id="response" aria-live="polite"></div><h2>Delivery log</h2><pre id="events"></pre></main><script type="module" src="/sse.ts"></script></body></html>
